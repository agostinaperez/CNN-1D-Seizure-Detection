[project]
name = "deteccion-crisis-eeg-cnn1d"
version = "0.1.0"
description = "Detección automática de eventos epilépticos en señales EEG mediante una CNN-1D."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "matplotlib==3.10.8",
    "mne==1.13.2",
    "numpy==2.4.4",
    "psutil==7.2.2",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "torch==2.14.0",
    "torchinfo==1.8.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
